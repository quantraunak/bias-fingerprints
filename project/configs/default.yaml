# Data contract — see docs/DATA.md
data:
  price_source: yfinance          # stooq endpoints went dead Aug 2026; yfinance is the working source
  start: "2010-01-01"
  end: "2024-12-31"
  force_refresh: false
  min_history_days: 252
  min_tickers: 300                # a real cross-section, not a handful of names
  min_success_ratio: 0.90
  max_missing_pct: 0.05
  retries: 3

universe:
  source: file_snapshot           # file_snapshot | file_pit | sp500_wikipedia_snapshot
  path: data/raw/universe_sp500.csv   # full 503-name universe: a decile is 50 names, not 4
  benchmark: SPY
  sector_source: yfinance

features:
  winsorize_limits: [0.01, 0.99]
  normalize: zscore
  sector_neutral: true

labels:
  horizon_days: 21

research:
  oos_start: "2017-01-01"         # reported metrics use PnL from this date onward

model:
  type: lightgbm
  min_train_samples: 2000
  lightgbm:
    n_estimators: 200
    max_depth: 3
    learning_rate: 0.04
    subsample: 0.75
    colsample_bytree: 0.75
    min_child_samples: 80
    reg_alpha: 0.2
    reg_lambda: 2.0
    n_cv_splits: 3
    embargo_days: 21

backtest:
  rebalance_freq: ME
  train_lookback_months: 36

portfolio:
  long_short_quantile: 0.10
  gross_leverage: 1.8
  max_weight: 0.05                # must exceed equal-weight (gross/n) or the box is infeasible
  beta_tolerance: 0.05
  beta_window: 252
  cov_window: 252
  risk_aversion: 6.0
  turnover_penalty: 0.25
  solver: CLARABEL

risk:
  cov_method: ledoit_wolf
  vol_target: 0.12
  vol_lookback: 126
  vol_ewma_span: 126
  min_leverage: 0.4
  max_leverage: 2.0
  dd_threshold: 0.08
  dd_min_scale: 0.35

costs:
  commission_bps: 1.0
  slippage_bps: 5.0
  stress_slippage_bps: [5, 10, 20]
